  <circle cx="1096" cy="844" r="5" fill="#173F35" stroke="#D7E5DC" stroke-width="3"/>
  <text x="1114" y="848" fill="#16211D" font-family="Arial, sans-serif" font-size="12" font-weight="700">Plan approved</text>
