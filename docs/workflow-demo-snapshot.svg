  <text x="456" y="652" fill="#98A39D" font-family="Arial, sans-serif" font-size="11">01</text>
  <text x="496" y="652" fill="#16211D" font-family="Arial, sans-serif" font-size="14" font-weight="700">Confirm release scope and target date</text>
  <text x="496" y="676" fill="#64706A" font-family="Arial, sans-serif" font-size="12">Owner · release manager</text>
