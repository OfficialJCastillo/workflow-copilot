<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Workflow Copilot approval workspace</title>
  <desc id="description">A full-stack operations workspace showing a PostgreSQL-backed release plan, owned steps, human approval, risks, and an audit trail.</desc>

  <rect width="1440" height="900" fill="#EDF0E9"/>

