  <text x="372" y="310" fill="#9CA69F" font-family="Arial, sans-serif" font-size="11">01</text>
  <text x="64" y="374" fill="#46524C" font-family="Arial, sans-serif" font-size="12" font-weight="700">Operational request</text>
