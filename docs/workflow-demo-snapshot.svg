  <text x="456" y="808" fill="#98A39D" font-family="Arial, sans-serif" font-size="11">03</text>
  <text x="496" y="808" fill="#16211D" font-family="Arial, sans-serif" font-size="14" font-weight="700">Run validation and document rollback steps</text>
  <text x="496" y="832" fill="#64706A" font-family="Arial, sans-serif" font-size="12">Owner · release manager</text>

