  <text x="40" y="216" fill="white" font-family="Arial, sans-serif" font-size="36" font-weight="700">accountable execution.</text>
  <text x="1080" y="169" fill="#C8F05A" font-family="Arial, sans-serif" font-size="30" font-weight="700">1</text>
  <text x="1062" y="194" fill="#A9BCB4" font-family="Arial, sans-serif" font-size="12">Total cases</text>
  <text x="1198" y="169" fill="#C8F05A" font-family="Arial, sans-serif" font-size="30" font-weight="700">0</text>
  <text x="1177" y="194" fill="#A9BCB4" font-family="Arial, sans-serif" font-size="12">In review</text>
  <text x="1314" y="169" fill="#C8F05A" font-family="Arial, sans-serif" font-size="30" font-weight="700">1</text>
  <text x="1292" y="194" fill="#A9BCB4" font-family="Arial, sans-serif" font-size="12">Approved</text>

