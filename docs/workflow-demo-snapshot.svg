  <text x="80" y="801" fill="#16211D" font-family="Arial, sans-serif" font-size="13" font-weight="700">rollback readiness, and audit history.</text>
  <text x="80" y="820" fill="#64706A" font-family="Arial, sans-serif" font-size="10">1/5 steps complete</text>

  <rect x="432" y="274" width="968" height="238" rx="14" fill="#FBFCF8" stroke="#D8DED7"/>
