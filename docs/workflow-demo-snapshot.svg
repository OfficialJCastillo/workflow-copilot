<svg width="1280" height="860" viewBox="0 0 1280 860" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="860" fill="#F4EFE7"/>
  <rect x="0" y="0" width="1280" height="860" fill="url(#bg)"/>
  <circle cx="142" cy="110" r="180" fill="#CDEBE6" fill-opacity="0.7"/>
  <rect x="84" y="78" width="1112" height="704" rx="36" fill="#FFFDF8" stroke="#D8CFC0" stroke-width="2"/>
  <text x="124" y="138" fill="#0F766E" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2.8">STRUCTURED PLANNING BEFORE AUTOMATION</text>
  <text x="124" y="196" fill="#1E1D1A" font-family="Georgia, serif" font-size="52" font-weight="700">workflow-copilot demo UI</text>
  <text x="124" y="236" fill="#645F56" font-family="Arial, sans-serif" font-size="22">A one-screen preview for turning messy requests into structured, inspectable workflow plans.</text>

  <rect x="124" y="286" width="360" height="430" rx="28" fill="#FFFDF8" stroke="#D8CFC0" stroke-width="2"/>
  <text x="152" y="330" fill="#645F56" font-family="Arial, sans-serif" font-size="18">Task request</text>
  <rect x="152" y="346" width="304" height="146" rx="18" fill="#F6F1E8"/>
  <text x="170" y="380" fill="#1E1D1A" font-family="Arial, sans-serif" font-size="18">Prepare a minor release for a</text>
  <text x="170" y="408" fill="#1E1D1A" font-family="Arial, sans-serif" font-size="18">customer-facing API next Thursday.</text>

  <text x="152" y="534" fill="#645F56" font-family="Arial, sans-serif" font-size="18">Requester role</text>
  <rect x="152" y="548" width="304" height="48" rx="16" fill="#FFFDF8" stroke="#D8CFC0"/>
  <text x="170" y="579" fill="#1E1D1A" font-family="Arial, sans-serif" font-size="18">engineering_manager</text>

  <text x="152" y="630" fill="#645F56" font-family="Arial, sans-serif" font-size="18">Team name</text>
  <rect x="152" y="644" width="304" height="48" rx="16" fill="#FFFDF8" stroke="#D8CFC0"/>
  <text x="170" y="675" fill="#1E1D1A" font-family="Arial, sans-serif" font-size="18">Platform</text>

  <rect x="152" y="708" width="220" height="44" rx="22" fill="url(#button)"/>
  <text x="182" y="736" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="700">Generate workflow plan</text>

  <rect x="516" y="286" width="640" height="430" rx="28" fill="#FFFDF8" stroke="#D8CFC0" stroke-width="2"/>
  <text x="548" y="330" fill="#1E1D1A" font-family="Georgia, serif" font-size="32" font-weight="700">Plan preview</text>

  <rect x="548" y="354" width="190" height="36" rx="18" fill="#D7F1EC"/>
  <text x="570" y="377" fill="#124B45" font-family="Arial, sans-serif" font-size="16" font-weight="700">release preparation</text>
  <rect x="750" y="354" width="126" height="36" rx="18" fill="#D7F1EC"/>
  <text x="790" y="377" fill="#124B45" font-family="Arial, sans-serif" font-size="16" font-weight="700">medium</text>

  <text x="548" y="430" fill="#645F56" font-family="Arial, sans-serif" font-size="18">Ordered steps</text>
  <rect x="548" y="444" width="576" height="110" rx="18" fill="#F6F1E8"/>
  <text x="572" y="474" fill="#1E1D1A" font-family="Arial, sans-serif" font-size="18">1. Confirm release scope and target date for Platform</text>
  <text x="572" y="502" fill="#645F56" font-family="Arial, sans-serif" font-size="16">Owner: engineering_manager  •  Status: pending</text>
  <text x="572" y="532" fill="#1E1D1A" font-family="Arial, sans-serif" font-size="18">2. Freeze the change list and confirm approvers</text>

  <rect x="548" y="578" width="270" height="106" rx="18" fill="#F6F1E8"/>
  <text x="570" y="608" fill="#645F56" font-family="Arial, sans-serif" font-size="18">Risks</text>
  <text x="570" y="638" fill="#1E1D1A" font-family="Arial, sans-serif" font-size="16">• Customer-facing changes increase</text>
  <text x="570" y="662" fill="#1E1D1A" font-family="Arial, sans-serif" font-size="16">  rollback sensitivity.</text>

  <rect x="854" y="578" width="270" height="106" rx="18" fill="#F6F1E8"/>
  <text x="876" y="608" fill="#645F56" font-family="Arial, sans-serif" font-size="18">Missing inputs</text>
  <text x="876" y="638" fill="#1E1D1A" font-family="Arial, sans-serif" font-size="16">• Exact release date and window.</text>
  <text x="876" y="662" fill="#1E1D1A" font-family="Arial, sans-serif" font-size="16">• Rollback owner and checklist.</text>

  <defs>
    <linearGradient id="bg" x1="640" y1="0" x2="640" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBF7F0"/>
      <stop offset="1" stop-color="#F4EFE7"/>
    </linearGradient>
    <linearGradient id="button" x1="152" y1="730" x2="372" y2="730" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F766E"/>
      <stop offset="1" stop-color="#155E75"/>
    </linearGradient>
  </defs>
